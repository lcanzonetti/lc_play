[package]
name = "lcmediaserver"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Lightweight show-control media server (WATCHOUT/Pixera-style): a canvas of outputs, content placed and timed across them, per-output warp and edge-blend"
license = "MIT"
repository = "https://github.com/lcanzonetti/lcmediaserver"

[[bin]]
name = "lcme"
path = "src/main.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 2+ (feature-gated so the core builds without native codec/audio libs):
ffmpeg-next = { version = "7", optional = true }
cpal = { version = "0.15", optional = true }

[features]
default = []
# Enables real video decode via system ffmpeg/libav (requires libav* dev libs + pkg-config).
video = ["dep:ffmpeg-next"]
# Enables audio output via cpal.
audio = ["dep:cpal"]

[dev-dependencies]
# Parse + validate the WGSL shaders in unit tests, so a shader error is caught
# even on machines (or CI runs) where the GPU tests have no adapter. Same naga
# version wgpu already uses, so nothing new is downloaded or compiled twice.
naga = { version = "24", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Default unwinding (no `panic = "abort"`): once decoding runs on worker
# threads (Phase 2), a panic there must be catchable so the show can keep
# running with a placeholder instead of the whole process going dark.
