[workspace]
members = ["engine"]
resolver = "2"

[package]
name = "lcmediaserver"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A lightweight, scalable media server with on-the-fly transcoding"
license = "MIT"
repository = "https://github.com/lcanzonetti/lcmediaserver"

[[bin]]
name = "lcmediaserver"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "sync", "time", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
mime_guess = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
