# LC Play — distributed media server.
#
# Every service is its own crate/binary so a show can run them on one machine
# or spread them across the network (see docs/ARCHITECTURE.md):
#
#   lc-proto      wire messages + shared data types (no I/O)
#   lc-time       cluster clock estimator, sync protocol, transport maths
#   lc-discovery  UDP multicast node discovery
#   lc-net        WebSocket control-channel client
#   lc-director   coordinator: authoritative state + master clock
#   lc-runner     display server: sync agent + wgpu renderer
#   lc-assets     asset manager: HTTP media store / transcoder
#   lc-ctl        command-line controller
[workspace]
members = [
    "crates/lc-proto",
    "crates/lc-time",
    "crates/lc-discovery",
    "crates/lc-net",
    "crates/lc-director",
    "crates/lc-runner",
    "crates/lc-assets",
    "crates/lc-ctl",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/lcanzonetti/lc_play"

# One place to pin versions shared by several crates.
[workspace.dependencies]
lc-proto = { path = "crates/lc-proto" }
lc-time = { path = "crates/lc-time" }
lc-discovery = { path = "crates/lc-discovery" }
lc-net = { path = "crates/lc-net" }
lc-director = { path = "crates/lc-director" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util", "process"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
