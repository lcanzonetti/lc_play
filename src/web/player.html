<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lcmediaserver</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36;
    --fg: #e7ebf0; --muted: #8b93a1; --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: grid; grid-template-columns: 320px 1fr; height: 100vh;
  }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; height: auto; } }
  aside {
    border-right: 1px solid var(--border); overflow-y: auto; background: var(--panel);
  }
  header { padding: 16px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .3px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .item {
    padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .item:hover { background: #1d222c; }
  .item.active { background: #223052; }
  .item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { color: var(--muted); font-size: 12px; }
  main { padding: 24px; overflow-y: auto; }
  video, audio { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; }
  .controls { margin: 16px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  label { color: var(--muted); font-size: 13px; }
  select, button {
    background: #1d222c; color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  button { cursor: pointer; }
  button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--muted); padding: 40px 16px; text-align: center; }
  code { background: #1d222c; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <aside>
    <header>
      <h1>lcmediaserver</h1>
      <p id="count">loading library…</p>
    </header>
    <div id="list"></div>
  </aside>
  <main>
    <div class="controls">
      <label>Mode
        <select id="mode">
          <option value="direct">Direct (no transcode)</option>
          <option value="mp4">Transcode → MP4</option>
          <option value="webm">Transcode → WebM</option>
        </select>
      </label>
      <label>Quality
        <select id="height">
          <option value="">Original</option>
          <option value="1080">1080p</option>
          <option value="720" selected>720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
        </select>
      </label>
      <button id="reload" title="Re-fetch the list. The server rescans the media folder on its own schedule (LCMS_SCAN_INTERVAL_SECS).">Refresh list</button>
    </div>
    <div id="player"><p class="empty">Select something from the library to play.</p></div>
  </main>

<script>
const $ = (s) => document.querySelector(s);
let items = [];
let currentId = null;

function fmtSize(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + " GB";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + " MB";
  if (n >= 1e3) return (n / 1e3).toFixed(0) + " KB";
  return n + " B";
}

// Element whose content is set as plain text (safe for untrusted strings).
function textEl(tag, className, text) {
  const el = document.createElement(tag);
  el.className = className;
  el.textContent = text;
  return el;
}

async function load() {
  let data;
  try {
    const res = await fetch("/api/library");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (e) {
    // Keep the previous list (if any) and say what went wrong, instead of
    // leaving "loading library…" on screen forever.
    $("#count").textContent = `couldn't load the library (${e.message}) — try Refresh`;
    return;
  }
  items = data.items;
  $("#count").textContent = data.count + " item" + (data.count === 1 ? "" : "s");
  const list = $("#list");
  list.innerHTML = "";
  if (!items.length) {
    list.innerHTML = '<p class="empty">No media found.<br>Point <code>LCMS_MEDIA_DIR</code> at your files.</p>';
    return;
  }
  for (const it of items) {
    const el = document.createElement("div");
    el.className = it.id === currentId ? "item active" : "item";
    el.dataset.id = it.id;
    // Build with textContent, never innerHTML: file names come from the
    // filesystem and may contain markup (stored XSS otherwise).
    el.append(
      textEl("div", "name", it.name),
      textEl("div", "meta", `${it.kind} · ${fmtSize(it.size)}`),
    );
    el.onclick = () => play(it.id);
    list.appendChild(el);
  }
}

// URL for the current mode: the original file, or a transcode at the chosen
// quality.
function srcFor(it) {
  const mode = $("#mode").value;
  const height = $("#height").value;
  if (mode === "direct") return it.stream_url;
  const params = new URLSearchParams({ format: mode });
  if (height) params.set("height", height);
  return `${it.transcode_url}?${params}`;
}

function play(id) {
  currentId = id;
  const it = items.find((x) => x.id === id);
  if (!it) return;
  document.querySelectorAll(".item").forEach((e) =>
    e.classList.toggle("active", e.dataset.id === id));
  const url = srcFor(it);
  const media = document.createElement(it.kind === "audio" ? "audio" : "video");
  media.controls = true;
  media.autoplay = true;
  media.src = url; // property assignment: no HTML parsing of the URL
  const path = textEl("p", "meta", it.path);
  path.style.cssText = "color:var(--muted);margin-top:12px";
  $("#player").replaceChildren(media, path);
}

$("#mode").onchange = () => currentId && play(currentId);
$("#height").onchange = () => currentId && play(currentId);
$("#reload").onclick = load;
load();
</script>
</body>
</html>
