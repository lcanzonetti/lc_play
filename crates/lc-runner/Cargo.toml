[package]
name = "lc-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LC Play runner (display server): cluster sync agent + multi-output canvas playback engine (WATCHOUT-style): arrange displays on a virtual canvas, place content across them, with per-output warp and edge-blend"
license.workspace = true

[lib]
name = "lc_runner"
path = "src/lib.rs"

[[bin]]
name = "lc-runner"
path = "src/main.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Cluster side (agent): control channel, clock sync, discovery.
lc-proto.workspace = true
lc-time.workspace = true
lc-discovery.workspace = true
lc-net.workspace = true
tokio.workspace = true
clap.workspace = true

# Phase 2+ (feature-gated so the core builds without native codec/audio libs):
ffmpeg-next = { version = "7", optional = true }
cpal = { version = "0.15", optional = true }

[features]
default = []
# Enables real video decode via system ffmpeg/libav (requires libav* dev libs + pkg-config).
video = ["dep:ffmpeg-next"]
# Enables audio output via cpal.
audio = ["dep:cpal"]

[dev-dependencies]
# Integration tests run a real Director in-process next to several agents.
lc-director.workspace = true
