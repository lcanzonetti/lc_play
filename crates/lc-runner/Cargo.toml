[package]
name = "lc-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LC Play runner (display server): cluster sync agent + multi-output canvas playback engine (WATCHOUT-style): arrange displays on a virtual canvas, place content across them, with per-output warp and edge-blend"
license.workspace = true

[lib]
name = "lc_runner"
path = "src/lib.rs"

[[bin]]
name = "lc-runner"
path = "src/main.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Cluster side (agent): control channel, clock sync, discovery.
lc-proto.workspace = true
lc-hap.workspace = true
lc-time.workspace = true
lc-discovery.workspace = true
lc-net.workspace = true
tokio.workspace = true
clap.workspace = true

# Asset download (blocking, in a background thread). Plain HTTP only: the
# Asset Manager lives on the show network.
ureq = { version = "2", default-features = false }
snap = "1.1.2"
netdev = "0.36"
gethostname = "1.1.0"
base64 = "0.23.1"
# Each card's state behind a lock its render thread hands over fairly
# (`unlock_fair`), so the window thread is never starved of it.
parking_lot = { version = "0.12", features = ["arc_lock"] }

# Audio: the sound card through the operating system's own drivers (WASAPI,
# or ASIO with the `asio` feature; ALSA / CoreAudio elsewhere), sidecar PCM
# files read straight from a memory mapping, and lock-free hand-over of
# state to the audio callback. `realtime`: cpal raises its audio thread
# (MMCSS "Pro Audio" on Windows, RT scheduling on Linux).
cpal = { version = "0.18.2", features = ["realtime"] }
memmap2 = "0.9"
arc-swap = "1"

[features]
# ASIO drivers on Windows. Needs Steinberg's ASIO SDK (`CPAL_ASIO_DIR`) and
# LLVM to build; the SDK's licence (GPLv3 option) is why it is opt-in.
asio = ["cpal/asio"]

[dev-dependencies]
# Integration tests run a real Director in-process next to several agents.
lc-director.workspace = true

# Windows: LC Play's own DXGI swap chains on wgpu's D3D12 device (frame
# statistics, NVIDIA present barrier). The version must be the one wgpu-hal
# uses, so that the COM types it hands out are the same types.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }
