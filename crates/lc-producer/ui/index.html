<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LC Play — Producer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  A fixed top bar (main transport, cluster state, file and window menus) over
  a "desktop" of floating windows. Every window has the same skeleton:

    <section class="win" id="win-NAME">
      <header class="win-head"> title … close </header>   ← drag to move
      <div class="win-body"> … </div>
      <div class="win-grip"></div>                         ← drag to resize
    </section>

  Position, size and visibility of each are remembered per browser (see the
  window manager in app.js). All behaviour is in app.js; this file is only
  the skeleton it fills.
-->
<header id="topbar">
  <div class="brand">LC&nbsp;Play</div>
  <div class="group">
    <button id="btn-stop" title="Stop: pause the main timeline and return to the start">⏹</button>
    <button id="btn-play" class="primary" title="Play / pause the main timeline (Space)">▶</button>
    <div id="time" title="Main timeline">00:00:00.00</div>
    <div id="frame" class="dim"></div>
  </div>
  <div class="group">
    <label title="Loop the main timeline"><input type="checkbox" id="chk-loop"> loop</label>
    <label>rate
      <select id="sel-rate">
        <option value="250">0.25×</option><option value="500">0.5×</option>
        <option value="1000" selected>1×</option><option value="2000">2×</option>
      </select>
    </label>
  </div>
  <div id="cluster" class="group grow"></div>
  <div class="group">
    <button id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <button id="btn-new">New</button>
    <button id="btn-open">Open…</button>
    <button id="btn-save">Save…</button>
    <input type="file" id="file-open" accept=".json,application/json" hidden>
    <details id="win-menu">
      <summary>Windows</summary>
      <div id="win-menu-list"></div>
    </details>
  </div>
</header>

<div id="desktop">

  <section class="win" id="win-stage" data-title="Stage">
    <header class="win-head"><span class="win-title">Stage</span>
      <button id="stage-zoom-out" class="small" title="Zoom out (mouse wheel)">−</button>
      <span id="stage-zoom" class="dim mono" title="Zoom">100%</span>
      <button id="stage-zoom-in" class="small" title="Zoom in (mouse wheel)">+</button>
      <button id="stage-fit" class="small" title="Fit the displays (double-click an empty area)">Fit</button>
      <button id="stage-actual" class="small" title="1 canvas pixel = 1 screen pixel">1:1</button>
      <label class="dim" title="Snap edges to other displays and the canvas origin while dragging (hold Alt to disable)"><input type="checkbox" id="stage-snap" checked> snap</label>
      <button class="win-close" title="Hide">✕</button></header>
    <div class="win-body" id="stage-wrap"><canvas id="stage"></canvas></div>
    <div class="win-grip"></div>
  </section>

  <section class="win" id="win-assets" data-title="Assets">
    <header class="win-head"><span class="win-title">Assets</span>
      <button id="btn-upload">Upload…</button>
      <input type="file" id="file-upload" multiple hidden>
      <button class="win-close" title="Hide">✕</button></header>
    <div class="win-body col">
      <div id="asset-list" class="scroll grow"></div>
      <div class="foot">
        <button id="btn-color">+ Colour cue</button>
        <span class="dim">Drag onto a track, or double-click to add at the playhead of the open timeline.</span>
      </div>
    </div>
    <div class="win-grip"></div>
  </section>

  <section class="win" id="win-inspector" data-title="Inspector">
    <header class="win-head"><span class="win-title">Inspector</span><button class="win-close" title="Hide">✕</button></header>
    <div class="win-body scroll pad" id="inspector"></div>
    <div class="win-grip"></div>
  </section>

  <section class="win" id="win-timeline" data-title="Timeline">
    <header class="win-head"><span class="win-title">Timeline</span>
      <div id="tl-tabs"></div>
      <button class="win-close" title="Hide">✕</button></header>
    <div class="win-body col">
      <div class="toolbar">
        <button id="tl-stop" title="Stop this timeline">⏹</button>
        <button id="tl-play" title="Play / pause this timeline">▶</button>
        <span id="tl-time" class="mono">0.00 s</span>
        <span class="grow"></span>
        <button id="btn-track">+ Track</button>
        <button id="btn-control" title="Add a control cue (pause, play, stop, jump) at the playhead">+ Control cue</button>
        <label class="dim">zoom <input type="range" id="zoom" min="4" max="200" value="40"></label>
      </div>
      <div id="tl-scroll" class="scroll grow">
        <div id="tl-body">
          <div id="ruler"></div>
          <div id="cuerow" class="track"><div class="track-head"><span class="name dim">Control cues</span></div><div class="lane" id="cuelane"></div></div>
          <div id="tracks"></div>
          <div id="playhead"></div>
        </div>
      </div>
    </div>
    <div class="win-grip"></div>
  </section>

  <section class="win" id="win-tasks" data-title="Tasks">
    <header class="win-head"><span class="win-title">Tasks</span>
      <button id="btn-task">+ Task</button>
      <button class="win-close" title="Hide">✕</button></header>
    <div class="win-body scroll pad" id="tasks"></div>
    <div class="win-grip"></div>
  </section>

  <section class="win" id="win-log" data-title="Runner log">
    <header class="win-head"><span class="win-title">Runner log</span>
      <select id="log-runner"></select>
      <label class="dim"><input type="checkbox" id="log-follow" checked> follow</label>
      <button id="log-refresh" class="small">Refresh</button>
      <button class="win-close" title="Hide">✕</button></header>
    <div class="win-body scroll"><pre id="log-text" class="log"></pre></div>
    <div class="win-grip"></div>
  </section>

  <section class="win" id="win-runners" data-title="Runners">
    <header class="win-head"><span class="win-title">Runners</span><button class="win-close" title="Hide">✕</button></header>
    <div class="win-body scroll pad" id="runners"></div>
    <div class="win-grip"></div>
  </section>

</div>

<div id="toast" hidden></div>
<div id="modal" hidden><div class="box"><p id="modal-text"></p><div class="btns"><button id="modal-no">Cancel</button><button id="modal-yes" class="primary">OK</button></div></div></div>
<script src="app.js"></script>
</body>
</html>
