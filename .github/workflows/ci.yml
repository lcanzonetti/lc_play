name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · test (incl. offscreen GPU tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Mesa's software Vulkan driver (lavapipe) lets the engine's offscreen
      # GPU tests render real frames without a GPU.
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # GitHub Actions sets CI=true, so the offscreen GPU tests fail (rather
      # than skip) if the software Vulkan driver above isn't picked up.
      - run: cargo test --locked
