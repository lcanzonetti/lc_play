name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Mesa's software Vulkan driver (lavapipe) lets the engine's offscreen
      # GPU tests render real frames without a GPU.
      # Also: the web-view libraries the Producer's window links against on
      # Linux, ffmpeg for the Runner's video decoder test, and ALSA's
      # headers for the Runner's sound output.
      - name: Install system libraries
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          mesa-vulkan-drivers libwebkit2gtk-4.1-dev libgtk-3-dev ffmpeg libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  docker:
    name: asset manager image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lc-assets:ci .
